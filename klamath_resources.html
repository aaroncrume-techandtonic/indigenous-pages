<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klamath Resources</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-red: #C62828;
            --bg-yellow: #FFD600;
            --bg-black: #121212;
            --bg-water: #004D40;
            --text-main: #111111;
        }

        body {
            margin: 0;
            font-family: 'Lato', sans-serif;
            color: var(--text-main);
            background: radial-gradient(circle at top right, #f7f7f7, #efefef 60%, #e9e9e9);
        }

        main {
            max-width: 860px;
            margin: 0 auto;
            padding: 2.5rem 1.25rem 4rem;
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 4vw, 3.2rem);
            margin: 0 0 0.5rem;
            color: var(--bg-black);
        }

        .subtitle {
            margin: 0 0 2rem;
            font-size: 1.05rem;
        }

        .resource-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 0.85rem;
        }

        .resource-list a {
            display: block;
            text-decoration: none;
            color: var(--bg-black);
            background: white;
            border: 3px solid var(--bg-black);
            border-radius: 14px;
            padding: 0.95rem 1rem;
            font-weight: 700;
            box-shadow: 4px 4px 0 var(--bg-yellow);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .resource-list a:hover,
        .resource-list a:focus {
            transform: translateY(-2px);
            box-shadow: 6px 6px 0 var(--bg-red);
            outline: none;
        }

        .back-link {
            margin-top: 2rem;
            display: inline-block;
            background: var(--bg-water);
            color: white;
            text-decoration: none;
            padding: 0.8rem 1.2rem;
            border-radius: 999px;
            border: 3px solid var(--bg-black);
            font-weight: 900;
        }
    </style>
</head>
<body>
    <main>
        <h1 class="title">Klamath Resources</h1>
        <p class="subtitle">Starting points for learning and action around restoration, sovereignty, and watershed stewardship.</p>

        <ul class="resource-list">
            <li><a href="https://www.klamathtribes.org/" target="_blank" rel="noopener noreferrer">The Klamath Tribes</a></li>
            <li><a href="https://www.klamathriver.org/" target="_blank" rel="noopener noreferrer">Klamath River Renewal Corporation</a></li>
            <li><a href="https://waterdata.usgs.gov/monitoring-location/11530500" target="_blank" rel="noopener noreferrer">USGS Klamath River Monitoring</a></li>
            <li><a href="https://www.fisheries.noaa.gov/west-coast/endangered-species-conservation/southern-oregonnorthern-california-coast-coho-salmon" target="_blank" rel="noopener noreferrer">NOAA Coho Salmon Information</a></li>
        </ul>

        <a class="back-link" href="index.html">Back to the story</a>
    </main>
</body>
</html>
